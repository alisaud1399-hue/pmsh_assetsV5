<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3460">
<title>غير متصل — PMSH جرد</title>
<link rel="manifest" href="/inventory/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/inventory/icon-192.png">
<link rel="apple-touch-icon" href="/inventory/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f3460 0%, #1a5276 100%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .icon {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.7; opacity: 0.9; margin-bottom: 20px; }
  .indicator {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(220, 38, 38, 0.2);
    border: 1px solid rgba(220, 38, 38, 0.4);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .indicator .dot {
    width: 10px; height: 10px;
    background: #dc2626;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    font-family: inherit;
  }
  .btn-primary {
    background: #16a34a; color: #fff;
  }
  .btn-primary:hover { background: #15803d; }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
  .queue-info {
    margin-top: 24px;
    padding: 12px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
  }
  .queue-info strong { color: #fbbf24; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>غير متصل بالإنترنت</h1>
  <p>يبدو أن الاتصال بالإنترنت فقد. التطبيق يحفظ مسحاتك محلياً وستتم المزامنة تلقائياً عند عودة الاتصال.</p>
  <div class="indicator">
    <span class="dot"></span>
    <span>وضع غير متصل</span>
  </div>
  <div class="actions">
    <a href="/inventory/scan_offline.php" class="btn btn-primary">
      📋 متابعة المسح (Offline)
    </a>
    <button class="btn btn-secondary" onclick="location.reload()">
      🔄 إعادة المحاولة
    </button>
  </div>
  <div class="queue-info">
    المسحات المحفوظة محلياً: <strong id="queueCount">0</strong><br>
    <small>تتم المزامنة تلقائياً عند توفر الإنترنت</small>
  </div>
</div>

<script>
// Try to read queue count from IndexedDB
(async () => {
  try {
    if (!('indexedDB' in window)) return;
    // Lazy: just try to open our DB
    const req = indexedDB.open('PMSH_Inventory', 1);
    req.onsuccess = () => {
      const db = req.result;
      if (db.objectStoreNames.contains('scan_queue')) {
        const tx = db.transaction('scan_queue', 'readonly');
        const store = tx.objectStore('scan_queue');
        const countReq = store.count();
        countReq.onsuccess = () => {
          document.getElementById('queueCount').textContent = countReq.result;
        };
      } else {
        document.getElementById('queueCount').textContent = '0 (DB not initialized)';
      }
    };
  } catch (e) {
    // silent
  }
})();
</script>
</body>
</html>
